name: Deploy preview to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/cool-euler-v1sg8f
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Evita deploys concorrentes a pisarem-se um ao outro.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          # O repositório é servido em https://<user>.github.io/Monitor-silos/,
          # por isso o build precisa de referenciar os assets a partir deste
          # subcaminho em vez da raiz.
          VITE_BASE_PATH: /Monitor-silos/

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # O Pages ainda não está ativado neste repositório; pede à action
          # para o ativar automaticamente (fonte = GitHub Actions) em vez de
          # exigir um passo manual em Settings → Pages.
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
